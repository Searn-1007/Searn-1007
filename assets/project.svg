<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
<style>@font-face{font-family:'Head';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Sub';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.head{font-family:'Head',sans-serif;font-weight:700}
.sub{font-family:'Sub',sans-serif;font-weight:500}
.mono{font-family:'Mono',monospace}

.seam{stroke-dasharray:110;stroke-dashoffset:110;animation:seam 4s ease-in-out infinite}
@keyframes seam{0%{stroke-dashoffset:110}70%,100%{stroke-dashoffset:0}}
.torch{animation:torch 4s ease-in-out infinite}
@keyframes torch{0%{transform:translateY(0)}70%,100%{transform:translateY(110px)}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a13"/><stop offset="1" stop-color="#0c1526"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1c2b47" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="228" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="230" fill="url(#bg)"/>
  <rect width="1000" height="230" fill="url(#grid)" opacity=".35"/>
  
<rect x="0" y="0" width="6" height="230" fill="url(#accent)"/>
<text x="60" y="58" class="mono" font-size="13" fill="#a78bfa" letter-spacing="2">FEATURED PROJECT</text>
<text x="60" y="100" class="head" font-size="34" fill="#e6edf7">robotic-arm-ros2</text>
<text x="60" y="134" class="sub" font-size="17" fill="#8a9bb8">4-DOF welding robot arm — designed, simulated and controlled end to end</text>
<g transform="translate(60,160)"><rect width="104" height="30" rx="15" fill="#0d1729" stroke="#1c2b47"/><text x="52" y="20" text-anchor="middle" class="mono" font-size="12.5" fill="#22d3ee">SolidWorks</text></g><g transform="translate(174,160)"><rect width="71" height="30" rx="15" fill="#0d1729" stroke="#1c2b47"/><text x="36" y="20" text-anchor="middle" class="mono" font-size="12.5" fill="#22d3ee">Python</text></g><g transform="translate(255,160)"><rect width="145" height="30" rx="15" fill="#0d1729" stroke="#1c2b47"/><text x="72" y="20" text-anchor="middle" class="mono" font-size="12.5" fill="#22d3ee">MATLAB/Simulink</text></g><g transform="translate(410,160)"><rect width="63" height="30" rx="15" fill="#0d1729" stroke="#1c2b47"/><text x="32" y="20" text-anchor="middle" class="mono" font-size="12.5" fill="#22d3ee">ROS 2</text></g><g transform="translate(483,160)"><rect width="71" height="30" rx="15" fill="#0d1729" stroke="#1c2b47"/><text x="36" y="20" text-anchor="middle" class="mono" font-size="12.5" fill="#22d3ee">Gazebo</text></g>
<g transform="translate(860,115)" fill="none" stroke-linecap="round">
  <line x1="0" y1="-55" x2="0" y2="55" stroke="#1c2b47" stroke-width="10"/>
  <line class="seam" x1="0" y1="-55" x2="0" y2="55" stroke="url(#accent)" stroke-width="10"/>
  <circle class="torch" cx="0" cy="-55" r="9" fill="#22d3ee" stroke="none" filter="url(#glow)"/>
</g>
<text x="925" y="205" text-anchor="end" class="mono" font-size="13" fill="#8a9bb8">view repo →</text>

</g>
<rect x="1" y="1" width="998" height="228" rx="18" fill="none" stroke="#1c2b47" stroke-width="2"/>

</svg>
