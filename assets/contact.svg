<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170">
<style>@font-face{font-family:'Head';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Sub';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.head{font-family:'Head',sans-serif;font-weight:700}
.sub{font-family:'Sub',sans-serif;font-weight:500}
.mono{font-family:'Mono',monospace}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a13"/><stop offset="1" stop-color="#0c1526"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1c2b47" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="168" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="170" fill="url(#bg)"/>
  <rect width="1000" height="170" fill="url(#grid)" opacity=".35"/>
  
<text x="500.0" y="70" text-anchor="middle" class="head" font-size="28" fill="#e6edf7" letter-spacing="3">LET'S BUILD SOMETHING THAT MOVES</text>
<g transform="translate(330.0,96)">
  <rect width="340" height="46" rx="23" fill="#0d1729" stroke="url(#accent)" stroke-width="2"/>
  <path d="M24 15 H50 V33 H24 Z M24 15 L37 25 L50 15" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="194" y="29" text-anchor="middle" class="mono" font-size="16" fill="#e6edf7">hasonhd123@gmail.com</text>
</g>

</g>
<rect x="1" y="1" width="998" height="168" rx="18" fill="none" stroke="#1c2b47" stroke-width="2"/>

</svg>
