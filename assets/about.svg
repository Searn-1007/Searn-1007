<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<style>@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}
.head{font-family:'Head',sans-serif;font-weight:700}
.sub{font-family:'Sub',sans-serif;font-weight:500}
.mono{font-family:'Mono',monospace}

.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a13"/><stop offset="1" stop-color="#0c1526"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1c2b47" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="298" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)" opacity=".35"/>
  
<rect x="0" y="0" width="1000" height="46" fill="#0d1729"/>
<line x1="0" y1="46" x2="1000" y2="46" stroke="#1c2b47" stroke-width="2"/>
<circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
<text x="500.0" y="29" text-anchor="middle" class="mono" font-size="14" fill="#8a9bb8">son@hust: ~/about-me</text>
<g><text x="60" y="112" class="mono" font-size="16" fill="#a78bfa">$</text><text x="86" y="112" class="mono" font-size="16" fill="#22d3ee">whoami</text></g><g><text x="60" y="140" class="mono" font-size="16" fill="#8a9bb8">›</text><text x="86" y="140" class="mono" font-size="16" fill="#e6edf7">Nguyễn Hà Sơn — Mechatronics student, Talented Engineering Program @ HUST (2023–)</text></g><g><text x="60" y="168" class="mono" font-size="16" fill="#a78bfa">$</text><text x="86" y="168" class="mono" font-size="16" fill="#22d3ee">cat focus.txt</text></g><g><text x="60" y="196" class="mono" font-size="16" fill="#8a9bb8">›</text><text x="86" y="196" class="mono" font-size="16" fill="#e6edf7">Robotics, end to end: from the first sketch to a robot that actually moves</text></g><g><text x="60" y="224" class="mono" font-size="16" fill="#a78bfa">$</text><text x="86" y="224" class="mono" font-size="16" fill="#22d3ee">echo $STATUS</text></g><g><text x="60" y="252" class="mono" font-size="16" fill="#8a9bb8">›</text><text x="86" y="252" class="mono" font-size="16" fill="#e6edf7">Building robots, one joint at a time<tspan class="cursor" fill="#22d3ee"> ▌</tspan></text></g>

</g>
<rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#1c2b47" stroke-width="2"/>

</svg>
